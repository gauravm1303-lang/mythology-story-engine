name: Generate Mythology Episode

on:
  workflow_dispatch:
    inputs:
      episode_number:
        description: "Episode number to generate"
        required: true
        default: "1"
        type: string

permissions:
  contents: write

jobs:
  generate-episode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # STEP 1 — Generate raw episode screenplay
      - name: Generate episode draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EPISODE_NUMBER: ${{ inputs.episode_number }}
        run: |
          python generate_episode.py

      # STEP 2 — Polish + continuity check
      - name: Polish episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EPISODE_NUMBER: ${{ inputs.episode_number }}
        run: |
          python polish_episode.py

      # STEP 3 — Upload both versions
      - name: Upload episode files
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ inputs.episode_number }}-screenplay
          path: |
            episode_*_draft.json
            episode_*_final.json
          if-no-files-found: error

      # STEP 4 — Save generated files permanently in repository
      - name: Commit generated episode
        run: |
          git config user.name "mythology-story-bot"
          git config user.email "mythology-story-bot@users.noreply.github.com"

          git add episode_*_draft.json episode_*_final.json

          if git diff --cached --quiet; then
            echo "No episode changes to commit."
          else
            git commit -m "Generate and polish episode ${{ inputs.episode_number }}"
            git push
          fi
