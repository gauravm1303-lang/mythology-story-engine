name: Generate Mythology Episode

on:
  workflow_dispatch:
    inputs:
      episode_number:
        description: "Episode number to generate"
        required: true
        default: "1"
        type: string

permissions:
  contents: write

jobs:
  generate-episode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate episode screenplay
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EPISODE_NUMBER: ${{ inputs.episode_number }}
        run: |
          python generate_episode.py

      - name: Upload episode artifact
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ inputs.episode_number }}-draft
          path: episode_*_draft.json
          if-no-files-found: error

      - name: Save generated episode to repository
        run: |
          git config user.name "mythology-story-bot"
          git config user.email "mythology-story-bot@users.noreply.github.com"

          git add episode_*_draft.json

          if git diff --cached --quiet; then
            echo "No new episode file to commit."
          else
            git commit -m "Generate episode ${{ inputs.episode_number }} draft"
            git push
          fi
